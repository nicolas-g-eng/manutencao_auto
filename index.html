<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Revisa">
<title>Revisa · Manutenção automotiva</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="login" class="login hidden">
  <div class="login-card">
    <div class="brand"><span id="loginMark"></span><b>Revisa</b></div>
    <p class="tag-line">Controle de manutenção automotiva</p>
    <form id="loginForm" autocomplete="on">
      <p class="note" id="loginMsg"></p>
      <label>Usuário ou e-mail<input id="user" autocomplete="username" required autocapitalize="none"></label>
      <label>Senha<span class="pw"><input id="pass" type="password" autocomplete="current-password" required minlength="6"><button type="button" class="eye" id="eye" aria-label="Mostrar senha"></button></span></label>
      <label class="only-setup hidden">Repita a senha<input id="pass2" type="password" autocomplete="new-password"></label>
      <label class="only-setup hidden">Importar dados (opcional, arquivo .json)<input id="seed" type="file" accept=".json,application/json"></label>
      <button class="btn primary wide" id="loginBtn">Entrar</button>
      <p class="err" id="loginErr"></p>
      <button type="button" class="btn wide" id="switchMode" style="margin-top:10px"></button>
      <details><summary>Já tenho um backup</summary>
        <p>Importe o arquivo de backup criptografado e depois entre com o mesmo usuário e senha.</p>
        <input id="importVault" type="file" accept=".json">
      </details>
    </form>
  </div>
</section>

<main id="app" class="hidden">
  <header class="top">
    <div class="brand"><span id="hMark"></span><b>Revisa</b></div>
    <button class="vsel" id="vsel" aria-label="Trocar veículo"></button>
    <button class="icon-btn" id="logout" aria-label="Sair" title="Sair"></button>
  </header>
  <div id="view"></div>
  <nav id="tabs"></nav>
</main>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
